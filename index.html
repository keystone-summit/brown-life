<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Brown Life" />
<meta name="description" content="Brown Life — Fortitudo · Honor · Impetus" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%230b0b10'/><text x='50%25' y='64%25' text-anchor='middle' font-family='Georgia,serif' font-size='104' font-weight='700' fill='%23d4a44c'>B</text></svg>" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b0b10'/><text x='50%25' y='64%25' text-anchor='middle' font-family='serif' font-size='38' font-weight='700' fill='%23d4a44c'>B</text></svg>" />
<title>Brown Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<!-- CDN deps pinned to exact versions. @babel/standalone MUST stay on 7.x:
     Babel 8 defaults the JSX runtime to "automatic", which emits
     `import { jsx } from "react/jsx-runtime"` — a bare ESM import that is a
     fatal SyntaxError inside a classic <script type="text/babel">, so the app
     silently dies (black screen). 7.26.4 keeps the classic React.createElement
     runtime that works with the UMD React global below. Do NOT unpin. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --bg-soft: #14141c;
    --bg-card: #1a1a24;
    --bg-card-hover: #20202d;
    --border: rgba(212,164,76,0.18);
    --border-soft: rgba(255,255,255,0.06);
    --text: #f4f1e8;
    --text-soft: #b9b3a4;
    --text-muted: #807a6d;
    --amber: #d4a44c;
    --amber-light: #ecc377;
    --amber-deep: #a8852f;
    --crimson: #c45a4a;
    --green: #7ab07a;
  }
  html, body, #root { background: var(--bg); color: var(--text); min-height: 100vh; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-image:
      radial-gradient(circle at 12% 10%, rgba(212,164,76,0.07) 0%, transparent 38%),
      radial-gradient(circle at 88% 92%, rgba(196,90,74,0.05) 0%, transparent 42%);
  }
  .font-display  { font-family: 'Instrument Serif', Georgia, serif; }
  .font-heraldic { font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.12em; }
  .text-amber { color: var(--amber); }
  .text-amber-light { color: var(--amber-light); }
  .text-soft { color: var(--text-soft); }
  .text-muted { color: var(--text-muted); }
  .bg-card { background: var(--bg-card); }
  .bg-soft { background: var(--bg-soft); }
  .border-amber-soft { border-color: var(--border); }
  .border-soft { border-color: var(--border-soft); }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: var(--border); }
  .card-lift:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px -20px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.04) inset;
  }

  /* ===== Snapshot system ===== */
  .snap {
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
    border: 1px solid var(--border-soft);
    overflow: hidden;
  }
  .snap-os     { border-top: 3px solid #e87f3a; }
  .snap-grif   { border-top: 3px solid #c9a44c; }
  .snap-header {
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(255,255,255,0.015);
  }
  .snap-title {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 13px;
    font-weight: 600;
  }
  .snap-dot { width: 10px; height: 10px; border-radius: 999px; }
  .snap-dot-os   { background: #e87f3a; box-shadow: 0 0 12px rgba(232,127,58,0.5); }
  .snap-dot-grif { background: #c9a44c; box-shadow: 0 0 12px rgba(201,164,76,0.5); }
  .snap-body { padding: 16px 18px 18px; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .kpi-tile {
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .kpi-tile:hover { border-color: var(--border); transform: translateY(-1px); }
  .kpi-value {
    font-size: 26px; font-weight: 700; line-height: 1.05;
    color: var(--text);
  }
  .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-top: 2px; }
  .kpi-sub   { font-size: 11px; color: var(--text-soft); margin-top: 4px; min-height: 14px; }
  .kpi-value-dim { color: var(--text-muted); }
  .tone-red    { color: #e8806e !important; }
  .tone-yellow { color: var(--amber-light) !important; }
  .tone-green  { color: #93c993 !important; }

  .open-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border-soft);
    color: var(--text-soft);
    background: transparent;
    transition: all .15s ease;
  }
  .open-link:hover { border-color: var(--amber); color: var(--amber-light); background: rgba(212,164,76,0.05); }
  .open-link-os:hover   { border-color: #e87f3a; color: #f0a472; background: rgba(232,127,58,0.06); }
  .open-link-grif:hover { border-color: #c9a44c; color: #e0bd6a; background: rgba(201,164,76,0.06); }

  /* ===== Dashboard grid (My Dashboards) ===== */
  .dash-group-header {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 0 4px;
  }
  .dash-group-dot { width: 8px; height: 8px; border-radius: 999px; }
  .dash-card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-top: 2px solid var(--dash-accent, var(--amber));
    border-radius: 12px;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .dash-card:hover {
    border-color: var(--dash-accent, var(--amber));
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -18px rgba(0,0,0,0.7);
  }
  .dash-dot {
    width: 10px; height: 10px; border-radius: 999px;
    display: inline-block;
  }
  .dash-dot.h-green  { box-shadow: 0 0 8px rgba(122,176,122,0.55); }
  .dash-dot.h-yellow { box-shadow: 0 0 8px rgba(212,164,76,0.55); }
  .dash-dot.h-red    { box-shadow: 0 0 8px rgba(196,90,74,0.55); }
  .dash-open {
    font-size: 11px;
    color: var(--dash-accent, var(--amber));
    opacity: 0.85;
  }

  /* ===== System Health strip ===== */
  .health-strip {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--bg-card);
  }
  .health-chip {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; padding: 4px 10px 4px 8px; border-radius: 999px;
    background: var(--bg-soft); border: 1px solid var(--border-soft);
    color: var(--text-soft);
  }
  .health-chip .h-dot { width: 8px; height: 8px; border-radius: 999px; }
  .h-green  { background: #7ab07a; }
  .h-yellow { background: #d4a44c; }
  .h-red    { background: #c45a4a; }
  .h-unk    { background: #807a6d; }
  .health-banner-red {
    background: linear-gradient(90deg, rgba(196,90,74,0.18), rgba(196,90,74,0.08));
    border: 1px solid rgba(196,90,74,0.4);
    color: #f3b8ad;
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
  }

  .section-title {
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border-soft), transparent);
  }
  .meta-stamp { font-size: 11px; color: var(--text-muted); }
  .btn {
    background: var(--amber);
    color: #1a1409;
    font-weight: 600;
    border-radius: 10px;
    padding: 8px 14px;
    transition: background .15s ease;
  }
  .btn:hover { background: var(--amber-light); }
  .btn-ghost {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 6px 12px;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover { border-color: var(--border); color: var(--text); }
  .input {
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    width: 100%;
  }
  .input:focus { outline: none; border-color: var(--amber); }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    color: var(--text-soft);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item:hover { background: var(--bg-card); color: var(--text); }
  .nav-item.active { background: rgba(212,164,76,0.12); color: var(--amber-light); border: 1px solid var(--border); }
  .progress-track { background: var(--bg-soft); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--amber-deep), var(--amber-light)); height: 100%; transition: width .25s ease; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-low    { background: rgba(122,176,122,0.15); color: #93c993; }
  .pill-medium { background: rgba(212,164,76,0.18);  color: var(--amber-light); }
  .pill-high   { background: rgba(196,90,74,0.18);   color: #e8806e; }
  .kanban-col { background: var(--bg-soft); border-radius: 14px; padding: 14px; min-height: 360px; }
  .kanban-card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; cursor: grab; }
  .kanban-card:hover { border-color: var(--border); }
  .kanban-card.dragging { opacity: 0.5; }
  .kanban-col.drag-over { background: rgba(212,164,76,0.06); border: 1px dashed var(--amber); }
  .cal-cell {
    min-height: 86px; padding: 6px; border: 1px solid var(--border-soft); border-radius: 8px;
    background: var(--bg-card); display: flex; flex-direction: column; gap: 4px;
  }
  .cal-cell.today { border-color: var(--amber); background: rgba(212,164,76,0.06); }
  .cal-cell.dim { opacity: 0.35; }
  .cal-event { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(212,164,76,0.18); color: var(--amber-light); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll-y { overflow-y: auto; }
  .scroll-y::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-y::-webkit-scrollbar-thumb { background: rgba(212,164,76,0.25); border-radius: 4px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chat-bubble-user      { background: var(--amber); color: #1a1409; padding: 10px 14px; border-radius: 14px 14px 2px 14px; max-width: 80%; white-space: pre-wrap; }
  .chat-bubble-assistant { background: var(--bg-card); border: 1px solid var(--border-soft); padding: 10px 14px; border-radius: 14px 14px 14px 2px; max-width: 80%; white-space: pre-wrap; }

  /* ===== Brown Life — heraldic login ===== */
  .login-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    /* Family crest as the full-viewport backdrop. Lighter overlay so the
       shield reads vividly; the PIN card carries its own backdrop for text. */
    background:
      linear-gradient(180deg, rgba(10,10,14,0.30) 0%, rgba(8,8,12,0.34) 55%, rgba(6,6,9,0.46) 100%),
      radial-gradient(circle at 50% 42%, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.32) 88%),
      url('/brown-family-crest.png');
    background-size: cover, cover, cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .login-card {
    width: 100%; max-width: 420px;
    text-align: center;
    /* Frosted glass: translucent enough that the crest reads through the
       keypad, blurred so the digits + brand text stay legible on top. */
    background: linear-gradient(180deg, rgba(16,16,23,0.50), rgba(9,9,14,0.60));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 30px 32px;
    box-shadow:
      0 40px 90px -32px rgba(0,0,0,0.9),
      0 0 0 1px rgba(212,164,76,0.06) inset,
      0 2px 0 rgba(255,255,255,0.03) inset;
  }
  .brand-name {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 30px;
    line-height: 1.1;
    color: var(--text);
    background: linear-gradient(180deg, #f6ecd2 0%, var(--amber-light) 55%, var(--amber-deep) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.55));
  }
  .brand-rule {
    width: 110px; height: 1px; margin: 12px auto 10px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .brand-motto {
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--amber-light);
    opacity: 0.92;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .brand-motto .sep { color: var(--text-muted); margin: 0 6px; }

  /* PIN keypad */
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 22px 0 6px; min-height: 18px; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 999px;
    border: 1.5px solid rgba(212,164,76,0.45);
    transition: background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .pin-dot.filled { background: var(--amber); border-color: var(--amber); transform: scale(1.06); }
  .pin-dot.err { border-color: var(--crimson); background: var(--crimson); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
  .key {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 24px; font-weight: 600;
    /* Solid white digits, shadowed for contrast against the crest. */
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.6);
    /* Near-transparent so the crest shows through each key. */
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    cursor: pointer; user-select: none;
    transition: background .12s ease, border-color .12s ease, transform .08s ease;
  }
  .key:hover { background: rgba(212,164,76,0.12); border-color: rgba(212,164,76,0.55); }
  .key:active {
    transform: scale(0.94);
    background: rgba(212,164,76,0.18);
    border-color: rgba(255,255,255,0.75);
  }
  .key-action {
    font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.06em;
    color: #ffffff;
  }
  .key-ghost { background: transparent; border-color: transparent; cursor: default; }
  .key-ghost:hover { background: transparent; border-color: transparent; }
  .pin-shake { animation: pinShake .4s ease; }
  @keyframes pinShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }

  /* Crest banner on the dashboard header */
  .crest-banner {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background:
      radial-gradient(circle at 0% 0%, rgba(212,164,76,0.10), transparent 60%),
      linear-gradient(90deg, rgba(26,26,36,0.9), rgba(16,16,22,0.6));
  }
  .crest-banner img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  .crest-banner .bb-name { font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.14em; text-transform: uppercase; font-size: 15px; color: var(--amber-light); }
  .crest-banner .bb-motto { font-family: 'Cinzel', Georgia, serif; letter-spacing: 0.22em; text-transform: uppercase; font-size: 10px; color: var(--text-muted); margin-top: 3px; }

  /* App cards (personal apps) */
  .app-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--app-accent, var(--amber));
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .app-card:hover {
    border-color: var(--app-accent, var(--amber));
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -20px rgba(0,0,0,0.75);
  }
  .app-card .app-ico {
    width: 46px; height: 46px; shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; border-radius: 11px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-soft);
  }
  .app-card .app-name { font-weight: 600; font-size: 15px; }
  .app-card .app-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .app-card .app-open { font-size: 12px; color: var(--app-accent, var(--amber)); opacity: 0.85; margin-left: auto; white-space: nowrap; }

  /* Sidebar brand crest */
  .sidebar .brand-crest { width: 36px; height: 36px; object-fit: contain; }

  /* Persistent top utility bar (brand + sign out), all tabs + viewports */
  .app-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    /* iOS standalone PWA: the translucent status bar (viewport-fit=cover +
       black-translucent) OVERLAYS page content, which starts at y=0. Without
       this inset the Sign Out button renders UNDER the status bar and taps are
       eaten by the OS — "visible but not clickable." env() resolves to 0 on
       desktop and normal browser tabs, so there is no visual change there. */
    margin: 0 0 22px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  /* Prominent crest at the top of the dashboard. Scales down a touch on
     phones so it never crowds the Sign Out button. */
  .topbar-crest {
    width: 52px; height: 52px; object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  }
  .topbar-wordmark { font-size: 1.25rem; }
  @media (max-width: 768px) {
    .topbar-crest { width: 42px; height: 42px; }
    .topbar-wordmark { font-size: 1.05rem; }
  }
  .signout-btn { display: inline-flex; align-items: center; gap: 8px; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; flex-direction: row !important; overflow-x: auto; border-top: 1px solid var(--border-soft); padding: 8px !important; z-index: 50; width: 100% !important; }
    .sidebar .nav-item { flex-direction: column; font-size: 10px; gap: 2px; padding: 6px 10px; white-space: nowrap; min-width: 64px; }
    .sidebar .brand { display: none !important; }
    .main { padding-bottom: 80px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// External-link opener. In a normal browser tab, target="_blank" already opens
// a new tab — we let it through untouched (so Cmd/Ctrl/middle-click keep working).
// BUT when Brown Life is launched as an installed home-screen PWA (iOS standalone
// / Android standalone), the browser SILENTLY IGNORES target="_blank" and the link
// replaces the whole app in-place. That was the "tiles still navigate away" bug.
// In standalone mode we intercept the click and force window.open(), which breaks
// the link out into the system browser instead of clobbering the app.
function isStandalonePWA() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
}
function openExternal(e, url) {
  // Respect modifier / non-primary clicks — let the native browser handle those.
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
  if (isStandalonePWA()) {
    e.preventDefault();
    window.open(url, '_blank', 'noopener,noreferrer');
  }
  // Normal tab: do nothing, the anchor's target="_blank" handles it.
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const txt = await r.text();
  let data; try { data = txt ? JSON.parse(txt) : {}; } catch { data = { error: txt }; }
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function fmtDate(d, opts) {
  if (!(d instanceof Date)) d = new Date(d);
  return d.toLocaleDateString(undefined, opts || { weekday: 'short', month: 'short', day: 'numeric' });
}
function isoDay(d) {
  if (!(d instanceof Date)) d = new Date(d);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString().slice(0, 10);
}
function sameDay(a, b) { return isoDay(a) === isoDay(b); }

// ===================== PIN GATE =====================
const MAX_PIN = 6;
function PinGate({ onAuthed }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState(false);
  const [errMsg, setErrMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const lastSubmitted = useRef(''); // guards the auto-submit against re-firing

  const submit = useCallback(async (value) => {
    setBusy(true); setErr(false); setErrMsg('');
    try {
      const d = await api('POST', '/api/auth', { pin: value });
      onAuthed(d && d.user);
    } catch (e) {
      const raw = (e && e.message) || '';
      const msg = /bad pin/i.test(raw) || !raw ? 'Wrong PIN — try again' : raw;
      setErr(true); setErrMsg(msg); setBusy(false);
      setTimeout(() => { setPin(''); setErr(false); }, 600);
    }
  }, [onAuthed]);

  const press = useCallback((d) => {
    if (busy) return;
    setErr(false);
    setPin((cur) => (cur.length >= MAX_PIN ? cur : cur + d));
  }, [busy]);

  const backspace = useCallback(() => { if (!busy) { setErr(false); setPin((c) => c.slice(0, -1)); } }, [busy]);

  // Auto-submit the moment the full 6-digit PIN is entered (no ✓ needed). The
  // ref keeps it from re-firing during the post-error window where the PIN is
  // briefly still full while busy flips back to false.
  useEffect(() => {
    if (pin.length < MAX_PIN) { lastSubmitted.current = ''; return; }
    if (pin.length === MAX_PIN && !busy && lastSubmitted.current !== pin) {
      lastSubmitted.current = pin;
      submit(pin);
    }
  }, [pin, busy, submit]);

  // Physical keyboard support.
  useEffect(() => {
    function onKey(e) {
      if (e.key >= '0' && e.key <= '9') press(e.key);
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Enter') { if (pin.length >= MAX_PIN) submit(pin); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [press, backspace, submit, pin]);

  const keys = ['1','2','3','4','5','6','7','8','9'];
  return (
    <div className="login-screen">
      <div className={`login-card ${err ? 'pin-shake' : ''}`}>
        <div className="brand-name">Brown&nbsp;Life</div>
        <div className="brand-rule"></div>
        <div className="brand-motto">
          Fortitudo<span className="sep">·</span>Honor<span className="sep">·</span>Impetus
        </div>

        <div className="pin-dots">
          {Array.from({ length: Math.max(MAX_PIN, pin.length) }).slice(0, MAX_PIN).map((_, i) => (
            <span key={i} className={`pin-dot ${i < pin.length ? 'filled' : ''} ${err ? 'err' : ''}`}></span>
          ))}
        </div>
        <div className={`text-xs ${err ? 'tone-red' : 'text-muted'}`} style={{ minHeight: '16px', textShadow: '0 1px 3px rgba(0,0,0,0.75)' }}>
          {busy ? 'Unlocking…' : err ? errMsg : 'Enter your PIN'}
        </div>

        <div className="keypad">
          {keys.map((k) => (
            <div key={k} className="key" onClick={() => press(k)}>{k}</div>
          ))}
          <div className="key key-action key-ghost" onClick={backspace}>⌫</div>
          <div className="key" onClick={() => press('0')}>0</div>
          <div className="key key-action" onClick={() => { if (pin.length >= MAX_PIN) submit(pin); }} title="Unlock">✓</div>
        </div>
      </div>
    </div>
  );
}

// ===================== SNAPSHOT CARDS =====================
function relTime(iso) {
  if (!iso) return '';
  const ageMs = Date.now() - new Date(iso).getTime();
  const m = Math.round(ageMs / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' hr ago';
  return Math.round(h / 24) + ' d ago';
}

function Tile({ tile, dim }) {
  const tone = tile && tile.tone ? `tone-${tile.tone}` : '';
  return (
    <div className="kpi-tile">
      <div className={`kpi-value ${dim ? 'kpi-value-dim' : ''} ${tone}`}>{tile && tile.value != null ? tile.value : '—'}</div>
      <div className="kpi-label">{tile && tile.label || ''}</div>
      <div className="kpi-sub">{tile && tile.sub || ''}</div>
    </div>
  );
}

function SnapshotCard({ flavor, title, dotClass, snap, openHref, openLabel }) {
  const empty = !snap || snap.ok === false;
  const t = snap && snap.tiles || {};
  const tileKeys = flavor === 'os'

    : ['days_to_attorney', 'acquisition_readiness', 'mrr', 'lessons_today', 'beta_codes_active', 'top_alert'];
  const stamp = snap && snap.fetchedAt
    ? `Last updated ${relTime(snap.fetchedAt)}${snap.cached ? ' · cached' : ''}`
    : 'Loading…';

  return (
    <div className={`snap snap-${flavor === 'os' ? 'os' : 'grif'}`}>
      <div className="snap-header">
        <div className="snap-title">
          <span className={`snap-dot snap-dot-${flavor === 'os' ? 'os' : 'grif'}`}></span>
          <span>{title}</span>
        </div>
        <div className="meta-stamp">{stamp}</div>
      </div>
      <div className="snap-body space-y-3">
        <div className="kpi-grid">
          {tileKeys.map((k) => <Tile key={k} tile={t[k]} dim={empty || !t[k] || t[k].value === '—'} />)}
        </div>
        <div className="flex items-center justify-between pt-1">
          <div className="text-xs text-muted">
            {empty && snap && snap.error ? <span className="text-red-400">{snap.error}</span>
              : (snap && Array.isArray(snap.missing) && snap.missing.length > 0)
                ? <span>Missing: {snap.missing.join(', ')}</span>
                : <span>&nbsp;</span>}
          </div>
          <a href={openHref} target="_blank" rel="noopener noreferrer" onClick={(e) => openExternal(e, openHref)} className={`open-link ${flavor === 'os' ? 'open-link-os' : 'open-link-grif'}`}>
            {openLabel} <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </div>
  );
}

// ===================== CALENDAR =====================
function Calendar({ events, reload }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const days = useMemo(() => {
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const startDow = first.getDay();
    const lastDay = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let i = startDow - 1; i >= 0; i--) {
      const d = new Date(cursor.getFullYear(), cursor.getMonth(), -i);
      cells.push({ date: d, inMonth: false });
    }
    for (let i = 1; i <= lastDay; i++) cells.push({ date: new Date(cursor.getFullYear(), cursor.getMonth(), i), inMonth: true });
    while (cells.length % 7 !== 0) {
      const last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), inMonth: false });
    }
    return cells;
  }, [cursor]);

  function nudge(months) { setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + months, 1)); }
  function eventsFor(d) { return events.filter(e => sameDay(e.start_at, d)); }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-3xl text-amber-light">{cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h2>
        <div className="flex items-center gap-2">
          <button className="btn-ghost" onClick={() => nudge(-1)}>‹ Prev</button>
          <button className="btn-ghost" onClick={() => setCursor(new Date(new Date().getFullYear(), new Date().getMonth(), 1))}>Today</button>
          <button className="btn-ghost" onClick={() => nudge(1)}>Next ›</button>
          <button className="btn flex items-center gap-1" onClick={() => { setEditing(null); setShowForm(true); }}>{ICON.plus} Event</button>
        </div>
      </div>

      <div className="grid grid-cols-7 gap-1 text-xs text-muted font-semibold uppercase tracking-wider px-1">
        {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d} className="px-2">{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {days.map((c, i) => {
          const isToday = sameDay(c.date, new Date());
          const evs = eventsFor(c.date);
          return (
            <div key={i} className={`cal-cell ${isToday ? 'today' : ''} ${!c.inMonth ? 'dim' : ''}`}>
              <div className={`text-xs font-semibold ${isToday ? 'text-amber' : 'text-soft'}`}>{c.date.getDate()}</div>
              {evs.slice(0, 4).map(e => (
                <div key={e.id} className="cal-event" onClick={() => { setEditing(e); setShowForm(true); }} title={e.title}>{e.title}</div>
              ))}
              {evs.length > 4 && <div className="text-[10px] text-muted">+{evs.length - 4} more</div>}
            </div>
          );
        })}
      </div>

      {showForm && <EventForm initial={editing} onClose={() => { setShowForm(false); setEditing(null); }} onSaved={reload} />}
    </div>
  );
}

function EventForm({ initial, onClose, onSaved }) {
  const isEdit = !!initial;
  const init = initial || {};
  const [title, setTitle] = useState(init.title || '');
  const [desc, setDesc]   = useState(init.description || '');
  const [start, setStart] = useState(init.start_at ? init.start_at.slice(0, 16) : new Date().toISOString().slice(0, 16));
  const [end, setEnd]     = useState(init.end_at ? init.end_at.slice(0, 16) : '');
  const [allDay, setAllDay] = useState(!!init.all_day);
  const [busy, setBusy] = useState(false);

  async function save(e) {
    e.preventDefault();
    setBusy(true);
    try {
      const body = {
        title, description: desc,
        start_at: new Date(start).toISOString(),
        end_at: end ? new Date(end).toISOString() : null,
        all_day: allDay,
      };
      if (isEdit) await api('PATCH', `/api/events?id=${initial.id}`, body);
      else        await api('POST',  '/api/events', body);
      await onSaved(); onClose();
    } catch (e) { alert(e.message); setBusy(false); }
  }
  async function del() {
    if (!confirm('Delete this event?')) return;
    setBusy(true);
    try { await api('DELETE', `/api/events?id=${initial.id}`); await onSaved(); onClose(); }
    catch (e) { alert(e.message); setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <form onClick={(e) => e.stopPropagation()} onSubmit={save} className="card p-6 max-w-md w-full space-y-3">

        <input className="input" placeholder="Title" value={title} onChange={(e) => setTitle(e.target.value)} required />

        <input type="datetime-local" className="input" value={end} onChange={(e) => setEnd(e.target.value)} />
        <label className="flex items-center gap-2 text-sm text-soft">
          <input type="checkbox" checked={allDay} onChange={(e) => setAllDay(e.target.checked)} /> All day
        </label>
        <div className="flex justify-between gap-2 pt-2">
          {isEdit ? <button type="button" className="btn-ghost text-red-400" onClick={del} disabled={busy}>Delete</button> : <span />}

            <button type="button" className="btn-ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn" disabled={busy}>{busy ? 'Saving…' : 'Save'}</button>

  );
}

    { key: 'doing', label: 'Doing' },
    { key: 'done',  label: 'Done'  },
  ];

  async function moveTo(taskId, status) {
    await api('PATCH', `/api/tasks?id=${taskId}`, { status });
    await reload();
  }

  async function del(id) {
    if (!confirm('Delete task?')) return;
    await api('DELETE', `/api/tasks?id=${id}`); await reload();
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">

      </div>

          const items = tasks.filter(t => t.status === col.key);
          return (

                 className={`kanban-col ${dragOver === col.key ? 'drag-over' : ''}`}
                 onDragOver={(e) => { e.preventDefault(); setDragOver(col.key); }}
                 onDragLeave={() => setDragOver(null)}
                 onDrop={async (e) => {
                   e.preventDefault();
                   setDragOver(null);
                   if (dragId.current) { await moveTo(dragId.current, col.key); dragId.current = null; }
                 }}>
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-semibold text-soft">{col.label} <span className="text-muted text-xs ml-1">{items.length}</span></h3>

                      </div>
                      <div className="flex flex-col gap-1">
                        <button className="text-muted hover:text-amber" onClick={() => { setEditing(t); setShowForm(true); }} title="Edit">✎</button>
                        <button className="text-muted hover:text-red-400" onClick={() => del(t.id)} title="Delete">{ICON.trash}</button>
                      </div>
                    </div>
                  </div>
                ))}
                {items.length === 0 && <div className="text-muted text-xs text-center py-6 italic">Drop tasks here</div>}
              </div>
            </div>
          );
        })}

function Goals({ goals, reload }) {

    await api('PATCH', `/api/goals?id=${g.id}`, { progress: p });
    await reload();
  }
  async function addSub(gId, title) {
    if (!title.trim()) return;
    await api('POST', `/api/goals?id=${gId}&sub=1`, { title });
    await reload();
  }
  async function toggleSub(s) {
    await api('PATCH', `/api/goals?sub_id=${s.id}`, { done: !s.done });
    await reload();
  }
  async function delGoal(id) {
    if (!confirm('Delete goal and its subtasks?')) return;
    await api('DELETE', `/api/goals?id=${id}`); await reload();
  }
  async function delSub(id) {
    await api('DELETE', `/api/goals?sub_id=${id}`); await reload();

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-3xl text-amber-light">Goals</h2>

  const endRef = useRef(null);

  useEffect(() => {
    api('GET', `/api/ai-chat?session_id=${encodeURIComponent(sessionId)}`).then(d => setMessages(d.messages || [])).catch(() => {});
  }, [sessionId]);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  async function send(e) {
    e.preventDefault();
    if (!draft.trim() || busy) return;
    const text = draft.trim();
    setDraft(''); setBusy(true);
    setMessages(m => [...m, { role: 'user', content: text, created_at: new Date().toISOString() }]);
    try {
      const d = await api('POST', '/api/ai-chat', { session_id: sessionId, message: text });
      setMessages(m => [...m, { role: 'assistant', content: d.reply, created_at: new Date().toISOString() }]);
    } catch (e) {
      setMessages(m => [...m, { role: 'assistant', content: 'Error: ' + e.message, created_at: new Date().toISOString() }]);
    } finally { setBusy(false); }
  }
  function newSession() {
    localStorage.removeItem('dblife_chat_session');
    location.reload();
  }

  return (
    <div className="flex flex-col h-[calc(100vh-180px)] md:h-[calc(100vh-100px)]">
      <div className="flex items-center justify-between mb-3">
        <h2 className="font-display text-3xl text-amber-light">AI Assistant</h2>
        <button className="btn-ghost text-xs" onClick={newSession}>New conversation</button>
      </div>
      <div className="card p-4 flex-1 scroll-y space-y-3">
        {messages.length === 0 && <p className="text-muted text-center mt-10">Start a conversation. Powered by Claude.</p>}
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={m.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-assistant'}>{m.content}</div>
          </div>
        ))}
        {busy && <div className="flex justify-start"><div className="chat-bubble-assistant text-muted italic">Thinking…</div></div>}
        <div ref={endRef}></div>
      </div>
      <form onSubmit={send} className="flex gap-2 mt-3">
        <input className="input flex-1" placeholder="Ask anything…" value={draft} onChange={(e) => setDraft(e.target.value)} disabled={busy} />
        <button type="submit" className="btn" disabled={busy || !draft.trim()}>Send</button>
      </form>
    </div>
  );
}

// ===================== APP SHELL =====================
// ===================== SETTINGS / CHANGE PIN =====================
function Settings({ user, onPinChanged }) {
  const [cur, setCur]   = useState('');
  const [nw, setNw]     = useState('');
  const [cf, setCf]     = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg]   = useState(null); // { ok: bool, text }

  const onlyDigits = (v) => v.replace(/[^0-9]/g, '').slice(0, MAX_PIN);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    if (nw.length !== MAX_PIN) return setMsg({ ok: false, text: `New PIN must be ${MAX_PIN} digits.` });
    if (nw !== cf)      return setMsg({ ok: false, text: 'New PIN and confirmation do not match.' });
    if (nw === cur)     return setMsg({ ok: false, text: 'New PIN must be different from your current PIN.' });
    setBusy(true);
    try {
      await api('POST', '/api/change-pin', { current_pin: cur, new_pin: nw, confirm_pin: cf });
      setMsg({ ok: true, text: 'PIN updated. Signing you out — sign back in with your new PIN…' });
      setTimeout(() => onPinChanged(), 1500);
    } catch (err) {
      setMsg({ ok: false, text: (err && err.message) || 'Could not change PIN. Please try again.' });
      setBusy(false);
    }
  }

  const field = (label, val, set, auto) => (
    <div>
      <label className="text-xs text-muted">{label}</label>
      <input
        className="input mt-1"
        type="password"
        inputMode="numeric"
        autoComplete={auto}
        placeholder="••••••"
        value={val}
        disabled={busy}
        onChange={(e) => set(onlyDigits(e.target.value))}
      />
    </div>
  );

  return (
    <div className="max-w-md">
      <div className="section-title mb-4"><span>Settings</span></div>
      <div className="card p-6 space-y-4">
        <div>
          <h3 className="font-semibold text-lg">Change my PIN</h3>
          <p className="text-xs text-muted mt-1">
            Signed in as <span className="text-amber-light font-medium">{user && user.name}</span>.
            You can only change your own PIN.
          </p>
        </div>
        <form onSubmit={submit} className="space-y-3">
          {field('Current PIN', cur, setCur, 'current-password')}
          {field('New PIN (6 digits)', nw, setNw, 'new-password')}
          {field('Confirm new PIN', cf, setCf, 'new-password')}
          {msg && (
            <div className={`text-sm ${msg.ok ? 'text-amber-light' : 'tone-red'}`}>{msg.text}</div>
          )}
          <button className="btn w-full" type="submit" disabled={busy}>
            {busy ? 'Updating…' : 'Update PIN'}
          </button>
        </form>
        <p className="text-[11px] text-muted">
          For your security you'll be signed out after a successful change and will
          need to sign in again with the new PIN.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed]   = useState(null);
  const [user, setUser]       = useState(null);
  const [tab, setTab]         = useState('home');
  const [events, setEvents]   = useState([]);
  const [tasks, setTasks]     = useState([]);
  const [goals, setGoals]     = useState([]);
  const [supps, setSupps]     = useState([]);
  const [todayLog, setLog]    = useState([]);
  const [snapOs, setSnapOs]   = useState(null);
  const [snapGriffin, setSnapGriffin] = useState(null);
  const [snapHealth, setSnapHealth]   = useState(null);

  useEffect(() => {
    api('GET', '/api/auth').then(d => { setAuthed(!!d.authed); setUser(d.user || null); }).catch(() => setAuthed(false));
  }, []);

  const reload = useCallback(async () => {
    if (!authed) return;
    const today = new Date();
    const from  = new Date(today.getFullYear(), today.getMonth() - 1, 1).toISOString();
    const to    = new Date(today.getFullYear(), today.getMonth() + 2, 1).toISOString();
    try {
      const [e, t, g, s] = await Promise.all([
        api('GET', `/api/events?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`),
        api('GET', '/api/tasks'),
        api('GET', '/api/goals'),
        api('GET', '/api/supplements'),
      ]);
      setEvents(e.events || []);
      setTasks(t.tasks || []);
      setGoals(g.goals || []);
      setSupps(s.supplements || []);
      setLog(s.today_log || []);
    } catch (err) { console.error(err); }
  }, [authed]);

  useEffect(() => { if (authed) reload(); }, [authed, reload]);

  // Snapshot pulls — independent of personal reload(), and refreshed
  // every 5 min on a warm tab. Cache lives server-side (15 min) so a
  // foreground refresh is cheap; the 5-min interval just keeps the
  // "Last updated X min ago" stamp honest.
  useEffect(() => {
    if (!authed) return;
    let alive = true;
    const pull = async () => {
      try {
        const [o, g, h] = await Promise.all([
          api('GET', '/api/snapshot-os').catch(() => null),
          api('GET', '/api/snapshot-griffin').catch(() => null),
          api('GET', '/api/snapshot-health').catch(() => null),
        ]);
        if (!alive) return;
        if (o) setSnapOs(o);
        if (g) setSnapGriffin(g);
        if (h) setSnapHealth(h);
      } catch {}
    };
    pull();
    const iv = setInterval(pull, 5 * 60 * 1000);
    return () => { alive = false; clearInterval(iv); };
  }, [authed]);

  async function takeSupp(id) {
    await api('POST', `/api/supplements?id=${id}&take=1`);
    await reload();
  }
  async function logout() {
    await api('DELETE', '/api/auth');
    setUser(null);
    setAuthed(false);
  }

  if (authed === null) {
    return <div className="min-h-screen flex items-center justify-center text-muted">Loading…</div>;
  }
  if (!authed) return <PinGate onAuthed={(u) => { setUser(u || null); setAuthed(true); }} />;

  const tabs = [
    { key: 'home',  label: 'Today',     icon: ICON.home },
    { key: 'cal',   label: 'Calendar',  icon: ICON.cal  },
    { key: 'tasks', label: 'Tasks',     icon: ICON.tasks },
    { key: 'goals', label: 'Goals',     icon: ICON.goal },
    { key: 'supp',  label: 'Supplements', icon: ICON.pill },
    { key: 'chat',  label: 'AI Chat',   icon: ICON.chat },
    { key: 'links', label: 'Links',     icon: ICON.link },
    { key: 'settings', label: 'Settings', icon: ICON.settings },
  ];

  return (
    <div className="flex min-h-screen">
      <aside className="sidebar w-56 shrink-0 p-5 flex flex-col gap-2 border-r border-soft">
        <div className="brand mb-4 flex items-center gap-3">
          <img src="/brown-family-crest.png" alt="Brown crest" className="brand-crest" />
          <div>
            <h1 className="font-heraldic text-lg text-amber-light leading-tight">Brown Life</h1>
            <p className="text-[10px] text-muted tracking-widest uppercase">Fortitudo · Honor · Impetus</p>
          </div>
        </div>
        {tabs.map(t => (
          <div key={t.key} className={`nav-item ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>
            {t.icon}<span>{t.label}</span>
          </div>
        ))}
      </aside>

      <main className="main flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full">
        <header className="app-topbar">
          <div className="flex items-center gap-2.5">
            <img src="/brown-family-crest.png" alt="" className="topbar-crest" />
            <span className="font-heraldic topbar-wordmark text-amber-light tracking-wider">Brown Life</span>
          </div>
          <div className="flex items-center gap-3">
            {user && user.name && (
              <span className="text-xs text-soft hidden sm:inline">
                Signed in as <span className="text-amber-light font-medium">{user.name}</span>
              </span>
            )}
            <button className="btn-ghost text-sm signout-btn" onClick={logout} title="Sign out">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span>Sign Out</span>
            </button>
          </div>
        </header>
        {tab === 'home'  && <Home user={user} events={events} tasks={tasks} supps={supps} todayLog={todayLog} onTakeSupp={takeSupp} snapOs={snapOs} snapGriffin={snapGriffin} snapHealth={snapHealth} />}
        {tab === 'cal'   && <Calendar events={events} reload={reload} />}
        {tab === 'tasks' && <Tasks tasks={tasks} reload={reload} />}
        {tab === 'goals' && <Goals goals={goals} reload={reload} />}
        {tab === 'supp'  && <Supplements supps={supps} todayLog={todayLog} reload={reload} take={takeSupp} />}
        {tab === 'chat'  && <AiChat />}
        {tab === 'links' && <QuickLinks health={snapHealth} />}
        {tab === 'settings' && <Settings user={user} onPinChanged={() => { setUser(null); setAuthed(false); setTab('home'); }} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
